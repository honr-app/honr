# RBAC for the Tailscale Kubernetes operator API proxy.
# The proxy authenticates callers as their Tailscale identity (typically the
# OpenShell gateway host). Bind that identity to the access sandboxes need.
#
#   # Replace the subject name with `tailscale status` → this machine's MagicDNS.
#   sed "s/GATEWAY_HOST.TAILNET.ts.net/$(tailscale status --json | jq -r .Self.DNSName | sed 's/\.$//')/" \
#     sandbox/microshift/tailscale-api-rbac.yaml | oc apply -f -
#
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: microshift-tailscale-gateway
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: GATEWAY_HOST.TAILNET.ts.net
