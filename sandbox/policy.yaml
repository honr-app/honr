# honr agent sandbox: reach Vertex for inference and GitHub for code. Nothing else.
version: 1

filesystem_policy:
  include_workdir: true
  # /opt/rust is the toolchain itself; /opt/cargo and /opt/npm-cache are the
  # pre-warmed registries baked by sandbox/Containerfile. Cargo and npm both
  # write to their caches during a build, so those two must be read_write —
  # without them a build fails on permissions, which surfaces as a hang.
  read_only: [/usr, /lib, /proc, /dev/urandom, /app, /etc, /var/log, /opt/rust]
  read_write: [/sandbox, /tmp, /dev/null, /opt/cargo, /opt/npm-cache]

landlock:
  compatibility: best_effort

network_policies:
  vertex_ai:
    name: vertex-ai
    endpoints:
      - { host: aiplatform.googleapis.com, port: 443, protocol: rest, enforcement: enforce, access: full }
      - { host: '*-aiplatform.googleapis.com', port: 443, protocol: rest, enforcement: enforce, access: full }
    binaries:
      - { path: /usr/local/bin/claude }
      - { path: /usr/bin/node }
      - { path: /usr/local/bin/node }

  github:
    name: github
    endpoints:
      - { host: api.github.com, port: 443, protocol: rest, enforcement: enforce, access: full }
      - { host: github.com, port: 443, protocol: rest, enforcement: enforce, access: full }
    binaries:
      - { path: /usr/bin/git }
      - { path: /usr/local/bin/git }
      - { path: /usr/bin/gh }
      - { path: /usr/local/bin/gh }
      - { path: /usr/bin/git-remote-https }
      - { path: /usr/lib/git-core/git-remote-https }
      - { path: /usr/bin/curl }
      - { path: /usr/local/bin/claude }
      - { path: /usr/bin/node }
