# Boot essentials for the control plane. Live create knobs (sandbox image /
# policy / cpu / memory / engine) and Agent runtime process settings live on
# the board (Settings / API) after empty-catalog seed from compiled defaults.
# Editing this file does not change an already-seeded board.

# Board persistence. Default is local SQLite (`sqlite:honr.db`). Set a
# postgres:// or postgresql:// URL (or HONR_DATABASE_URL) for Postgres.
# Empty DB + existing honr.json → one-shot import (JSON left in place).
# See docs/quickstart.md (Board database).
board:
  database:
    url: sqlite:honr.db

# Level schema — Project + flat Tasks.
# Project is the only container. Tasks are flat siblings under a Project,
# related by dependency edges (blocks / relates-to), not nested hierarchy.
levels:
  - name: Project
    horizon: 2q
    owner: human
    elaborate: on_commit
  - name: Task
    horizon: 1d
    owner: agent
    claimable: true
    requires: [definition_of_done]

# Execution control-plane timings + the agents startup gate.
execution:
  # How often to check for overdue run deadlines.
  # Run budget is Settings → Agent runtime `agent_timeout_secs` (one clock).
  # lease_secs / heartbeat_expect_secs are ignored if present (compat).
  sweep_interval_ms: 2000

  # Real agents in OpenShell sandboxes. Off by default so the board runs on a
  # machine with no podman, no gateway and no credentials. This `enabled` flag
  # is the process boot gate (seeded into Agent runtime on a fresh board);
  # turning it on spends real money — see docs/agents.md and docs/sandbox.md.
  # Other agent create knobs seed from compiled defaults; edit via Settings.
  agents:
    enabled: true
