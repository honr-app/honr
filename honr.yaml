# Level schema — your ladder, not mine (§4).
#
# The engine never reads these names; it reads the tree. Two facts are
# structural: does a node have children (container vs claimable leaf), and
# where does it sit relative to the commitment line. Everything below just
# drives labels, default gates, and what the UI asks a human to fill in.

levels:
  - name: Vision
    horizon: 18mo
    owner: human
    elaborate: never
  - name: Project
    horizon: 2q
    owner: human
    elaborate: on_commit
  - name: Epic
    horizon: 6w
    owner: human
    requires: [acceptance_criteria]
  - name: Story
    horizon: 1w
    owner: planner
    requires: [definition_of_done]
  - name: Task
    horizon: 1d
    owner: agent
    claimable: true

# Execution. These are control-plane timings, not simulation knobs: the lease
# is what makes a dead agent survivable, and cards decay visibly once their
# heartbeat is older than expected.
execution:
  lease_secs: 45
  heartbeat_expect_secs: 6
  sweep_interval_ms: 2000

  # Real agents in OpenShell sandboxes. Off by default so the board runs on a
  # machine with no podman, no gateway and no credentials. Turning this on
  # spends real money — see docs/phase-0-findings.md before you do.
  agents:
    enabled: false

    # Needs a Rust toolchain to build honr: docker build -f sandbox/Containerfile .
    image: honr-sandbox:latest
    policy: sandbox/policy.yaml
    providers: [vertex, gh-clankr]

    # The agent clones the fork and opens a PR against upstream. The bot has no
    # write access to upstream, so a cross-fork PR is its only way in.
    repo:
      upstream: shanemcd/honr
      fork: clankrshq/honr
      base: main

    # us-east5 is quota-exhausted and us-central1 does not serve the model.
    vertex:
      project: shanemcd-rh
      location: global
      model: claude-opus-5

    cpu: "2"
    memory: 4Gi

    # Sandboxes are heavy and OpenShell is alpha. Do not start at seven.
    max_concurrent: 2

    per_card_budget_cents: 200
    daily_budget_cents: 2000
    agent_timeout_secs: 1800
