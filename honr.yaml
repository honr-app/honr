# Level schema — Project + flat Tasks (beads Plan A).
#
# Project is the only container. Tasks are flat siblings under a Project,
# related by dependency edges (blocks / relates-to), not nested hierarchy.
# Vision / Epic / Story are retired.

# Board persistence. Default is local SQLite (`sqlite:honr.db`). Set a
# postgres:// or postgresql:// URL (or HONR_DATABASE_URL) for Postgres.
# Empty DB + existing honr.json → one-shot import (JSON left in place).
# See docs/quickstart.md (Board database).
board:
  database:
    url: sqlite:honr.db

levels:
  - name: Project
    horizon: 2q
    owner: human
    elaborate: on_commit
  - name: Task
    horizon: 1d
    owner: agent
    claimable: true
    requires: [definition_of_done]

# Execution. These are control-plane timings, not simulation knobs: the lease
# is what makes a dead agent survivable, and cards decay visibly once their
execution:
  # Run budget is agents.agent_timeout_secs (one clock). lease_secs /
  # heartbeat_expect_secs are ignored if present (compat with older yaml).
  sweep_interval_ms: 2000

  # Real agents in OpenShell sandboxes. Off by default so the board runs on a
  # machine with no podman, no gateway and no credentials. Turning this on
  # spends real money — see docs/agents.md and docs/sandbox.md before you do.
  agents:
    enabled: true
    engine: cursor

    # Needs a Rust toolchain to build honr: docker build -f sandbox/Containerfile .
    image: honr-sandbox:latest
    policy: sandbox/policy.yaml

    # Legacy optional seed only — work remotes come from each card's
    # pull_request (report.json url/base/head). Not required for first clone.
    repo:
      upstream: shanemcd/honr
      # Same-repo: GitHub App install on shanemcd pushes honr/card-* and opens PRs.
      # main stays owner-only via ruleset; bot must not merge.
      fork: shanemcd/honr
      base: main

    # Branch / sandbox name stem (default honr → honr/card-N / honr-card-N-a1).
    # branch_prefix: honr

    cpu: "2"
    memory: 4Gi

    # Sandboxes are heavy and OpenShell is alpha. Do not start at seven.
    # Deliberately 1 until gates are supervisor-run rather than agent-claimed.
    max_concurrent: 1

    agent_timeout_secs: 1800

    # Runs that die without producing work before the card becomes a human's
    # problem. Without a count, early failures requeue every lease period forever.
    max_attempts: 3
