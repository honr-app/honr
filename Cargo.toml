[package]
name = "honr"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[dependencies]
axum = "0.8"
tokio = { version = "1.53", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "cors", "trace"] }
tower-service = "0.3"
base64 = "0.23"
hyper = "1"
hyper-util = "0.1"

rmcp = { version = "3.0", features = [
    "server",
    "macros",
    "transport-streamable-http-server",
    "tower",
] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
schemars = "1"

chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "2"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
sqlx = { version = "0.8.6", features = ["runtime-tokio", "tls-rustls", "sqlite", "postgres", "migrate", "chrono", "json"] }
